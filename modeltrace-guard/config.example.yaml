# modeltrace-guard plugin configuration snippet for CLIProxyAPI config.yaml.
# Merge into the existing config under the top-level `plugins:` key.
plugins:
  enabled: true
  configs:
    modeltrace-guard:
      enabled: true
      # Path to the ModelTrace unified fingerprint bank. The bank is cached
      # and reloaded automatically when the file changes.
      bank_path: "data/unified_bank.json"
      # Minutes between scheduled probe runs; 0 disables scheduled probing.
      # Values below 15 are clamped to 15 to protect quota.
      interval_minutes: 60
      # Long-integer challenge probes per run per credential (1-3).
      probes_per_run: 3
      # Credential filters. Remove to probe every active credential.
      providers:
        - codex
        - claude
      # auth_ids: []
      # Provider -> expected model id, used as the attribution baseline.
      # Without a mapping the run is reported as "unlabeled".
      models:
        codex: gpt-5.6
        claude: claude-opus-5
      # Suite environments (1-12) to draw probes from; 1/5/6 are the
      # clean-transport ones (no system prefix, no user prefix).
      # environments: [1, 5, 6]
      # Optional JSONL file to append every probe record to.
      # history_path: ""
      # In-memory ring sizes.
      # history_size: 200
      # routing_size: 1000
      # Protocol translation applied to probe requests.
      # entry_protocol: "openai"
      # exit_protocol: "openai"
